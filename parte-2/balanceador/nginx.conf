events {}

http {
    # DNS interno do Docker. Pergunta de novo a cada 2 s onde está cada site,
    # porque um site que cai e volta pode voltar com outro endereço IP.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream meus_sites {
        zone meus_sites 64k;      # memória compartilhada, exigida pelo "resolve"
        server site1:80 resolve;  # site1 e site2 = nomes dos serviços no docker-compose.yml
        server site2:80 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://meus_sites;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Site fora do ar: desiste em 1 s (o padrão é 60 s) e tenta o outro.
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;

            # Mostra, nas ferramentas do navegador (F12 > Rede), qual site respondeu.
            add_header X-Atendido-Por $upstream_addr always;
        }
    }
}
